services:
  nasa-app:
    build: .
    container_name: nasa-mars-rover
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - NASA_API_KEY=${NASA_API_KEY:-DEMO_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - nasa_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nasa-network

volumes:
  nasa_data:

networks:
  nasa-network:
    driver: bridge
