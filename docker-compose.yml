version: "3.9"

services:
  nasa-app:
    build: .
    container_name: nasa-mars-rover
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NASA_API_KEY=${NASA_API_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - nasa_data:/app/data
    networks:
      - nasa-network

volumes:
  nasa_data:

networks:
  nasa-network:
    driver: bridge
