services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    user: '1000:1000'
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:?Set APP_PORT}:5000"
    env_file: secrets.env
    volumes:
      - app_data:/app/data
    command: [gunicorn, --bind, '0.0.0.0:5000', --workers, '1', --threads, '4', --timeout, '120', 'main:app']
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  app_data:
