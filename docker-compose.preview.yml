name: nasarover-preview
services:
  nasa-app:
    build: .
    image: nasarover-preview:local
    container_name: nasarover-preview
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:5000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
      TZ: Europe/Prague
    volumes:
      - preview_data:/app/data
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--threads", "4", "--timeout", "120", "main:app"]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  preview_data:
