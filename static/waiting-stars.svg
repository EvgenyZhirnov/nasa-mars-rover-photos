<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200px" height="200px" viewBox="0 0 200 200" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <g stroke="none" fill="none">
        <!-- Twinkling stars -->
        <circle cx="20" cy="30" r="1.5" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
        </circle>
        <circle cx="40" cy="50" r="1" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite" />
        </circle>
        <circle cx="70" cy="25" r="2" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="100" cy="40" r="1.2" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="130" cy="20" r="1.8" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite" />
        </circle>
        <circle cx="150" cy="55" r="1" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite" />
        </circle>
        <circle cx="170" cy="35" r="1.5" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite" />
        </circle>
        <circle cx="30" cy="70" r="1.2" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite" />
        </circle>
        <circle cx="60" cy="90" r="1" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite" />
        </circle>
        <circle cx="90" cy="75" r="1.8" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite" />
        </circle>
        <circle cx="120" cy="95" r="1.5" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="3.9s" repeatCount="indefinite" />
        </circle>
        <circle cx="160" cy="80" r="1" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite" />
        </circle>
        <circle cx="180" cy="65" r="1.2" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite" />
        </circle>
        <circle cx="25" cy="110" r="1.5" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite" />
        </circle>
        <circle cx="50" cy="125" r="1.2" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite" />
        </circle>
        <circle cx="85" cy="115" r="1" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="4.3s" repeatCount="indefinite" />
        </circle>
        <circle cx="110" cy="130" r="1.8" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="3.7s" repeatCount="indefinite" />
        </circle>
        <circle cx="140" cy="110" r="1.5" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite" />
        </circle>
        <circle cx="175" cy="120" r="1" fill="#fff">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="4.1s" repeatCount="indefinite" />
        </circle>
        
        <!-- Larger special star with color effect -->
        <circle cx="100" cy="100" r="3" fill="#ff5a00">
            <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite" />
            <animate attributeName="fill" values="#ff5a00;#ffaa00;#ff5a00" dur="2s" repeatCount="indefinite" />
        </circle>
        
        <!-- Shooting star -->
        <path d="M160,20 L120,60" stroke="#fff" stroke-width="1" opacity="0">
            <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" />
        </path>
        <circle cx="120" cy="60" r="1" fill="#fff" opacity="0">
            <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" />
            <animate attributeName="r" values="0;2;0" dur="5s" repeatCount="indefinite" />
        </circle>
        
        <!-- Second shooting star with delay -->
        <path d="M40,180 L80,140" stroke="#fff" stroke-width="1" opacity="0">
            <animate attributeName="opacity" values="0;1;0" dur="5s" begin="2.5s" repeatCount="indefinite" />
        </path>
        <circle cx="80" cy="140" r="1" fill="#fff" opacity="0">
            <animate attributeName="opacity" values="0;1;0" dur="5s" begin="2.5s" repeatCount="indefinite" />
            <animate attributeName="r" values="0;2;0" dur="5s" begin="2.5s" repeatCount="indefinite" />
        </circle>
        
        <!-- Mars silhouette on the horizon -->
        <circle cx="100" cy="240" r="150" fill="#a6433e" opacity="0.7" />
        
        <!-- Text message -->
        <text x="100" y="180" font-family="Arial" font-size="10" text-anchor="middle" fill="#fff">
            Скоро здесь появятся марсианские снимки
        </text>
    </g>
</svg>