<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200px" height="200px" viewBox="0 0 200 200" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <g stroke="none" fill="none">
        <!-- Mars surface -->
        <path d="M0,150 C20,140 40,160 60,150 C80,140 100,160 120,150 C140,140 160,160 180,150 L200,150 L200,200 L0,200 Z" fill="#a6433e">
        </path>
        
        <!-- Rover body -->
        <rect x="70" y="120" width="60" height="25" rx="5" fill="#ddd" />
        <rect x="75" y="110" width="50" height="15" rx="3" fill="#ccc" />
        
        <!-- Rover wheels -->
        <circle cx="80" cy="150" r="10" fill="#555" />
        <circle cx="80" cy="150" r="5" fill="#333" />
        <circle cx="120" cy="150" r="10" fill="#555" />
        <circle cx="120" cy="150" r="5" fill="#333" />
        
        <!-- Rover camera and antenna -->
        <rect x="95" y="95" width="10" height="20" fill="#aaa" />
        <circle cx="100" cy="90" r="8" fill="#888" />
        <circle cx="100" cy="90" r="4" fill="#333" />
        <line x1="105" y1="105" x2="115" y2="80" stroke="#999" stroke-width="2" />
        <circle cx="115" cy="80" r="3" fill="#999" />
        
        <!-- Dust animation -->
        <g id="dust">
            <circle cx="70" cy="155" r="2" fill="#a6433e" opacity="0.7">
                <animate attributeName="cx" values="70;60" dur="2s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite" />
            </circle>
            <circle cx="75" cy="153" r="3" fill="#a6433e" opacity="0.6">
                <animate attributeName="cx" values="75;62" dur="2.5s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="0.6;0" dur="2.5s" repeatCount="indefinite" />
            </circle>
            <circle cx="130" cy="155" r="2" fill="#a6433e" opacity="0.7">
                <animate attributeName="cx" values="130;140" dur="2s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite" />
            </circle>
            <circle cx="125" cy="153" r="3" fill="#a6433e" opacity="0.6">
                <animate attributeName="cx" values="125;138" dur="2.5s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="0.6;0" dur="2.5s" repeatCount="indefinite" />
            </circle>
        </g>
        
        <!-- Stars in the background -->
        <circle cx="30" cy="30" r="1" fill="#fff" opacity="0.8" />
        <circle cx="50" cy="15" r="1.5" fill="#fff" opacity="0.7" />
        <circle cx="80" cy="40" r="1" fill="#fff" opacity="0.9" />
        <circle cx="120" cy="25" r="1.2" fill="#fff" opacity="0.8" />
        <circle cx="150" cy="35" r="1" fill="#fff" opacity="0.7" />
        <circle cx="170" cy="15" r="1.3" fill="#fff" opacity="0.9" />
        <circle cx="190" cy="40" r="1" fill="#fff" opacity="0.8" />
        <circle cx="20" cy="60" r="1.4" fill="#fff" opacity="0.7" />
        <circle cx="40" cy="50" r="1" fill="#fff" opacity="0.9" />
        <circle cx="170" cy="70" r="1.2" fill="#fff" opacity="0.8" />
        
        <!-- Loading text -->
        <text x="100" y="180" font-family="Arial" font-size="10" text-anchor="middle" fill="#fff">
            Ожидание фотографий с Марса...
        </text>
    </g>
</svg>